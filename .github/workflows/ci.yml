name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:00 CST。推到 main 也会跑；没有这条 cron，仓库闲着时夜间任务不会启动。
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  # 合并门禁：对应 docs/prd/19-testing.md 的 TST-070 至 TST-076
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: 格式
        run: make fmt-check
      - name: vet
        run: make vet
      - name: 架构契约检查
        run: make contract
      - name: 竞态检测下的测试
        run: make test-race
      - name: 覆盖率门槛
        run: make cover-check
      - name: 交叉编译
        run: make cross
      - name: 短时 fuzz
        run: make fuzz-short

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: 依赖漏洞扫描
        run: make vuln

  # 夜间随机种子的确定性模拟（TST-034）。
  #
  # 门禁跑固定种子集，这里跑随机的：失败时日志里有可直接重放的命令，
  # 把那个种子加进 defaultSimSeeds 就变成一条永久回归。
  simulation-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: 随机种子模拟
        run: make sim SIM_SEEDS=200 SIM_OPS=5000

  # 长时 fuzz 不在 CI 里（TST-239，2026-11-28 取代 TST-128）。
  #
  # 它曾经是一个定时任务：11 个目标 × FUZZTIME **串行**，FUZZTIME=5m 就是约
  # 55 分钟。去掉它的理由不是"fuzz 没用"，而是**那样跑它买不到东西**：
  #
  #   - fuzz 是搜索而不是检查，它的收益来自搜索时间累积；而 Go 的工作语料在
  #     `$GOCACHE/fuzz` 里，CI 这边 `actions/setup-go` 的缓存按 go.sum 哈希命中、
  #     命中就不回写，于是每晚都从仓库里那几份种子重新开始搜。代码没变、起点
  #     没变，只有随机数变——一小时大半在重复摇同一把骰子。
  #   - 挡合并与挡发布的是 gate（约 5 分钟），它本来就跑 `make fuzz-short`：
  #     14 个目标、各 5–10 秒，而且**永久重放已入库的崩溃语料**，所以已知的坑
  #     回不来。
  #
  # 要深搜时手动跑 `make fuzz-long FUZZTIME=5m`（解析器那几个包改动之后值得
  # 跑一次）。新抓到的输入按 TST-239 手工入库到对应包的 `testdata/fuzz/`，
  # 入库之后它就进了门禁的重放集。
